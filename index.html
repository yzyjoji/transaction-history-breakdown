<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History Summary</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- html2canvas and jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Chart.js for the pie charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- XLSX for reading Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .grid-cell-input {
            transition: all 0.2s ease-in-out;
            outline: none;
        }
        .grid-cell-input:focus {
            z-index: 10;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 sm:p-8">
    <div id="app" class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-600 dark:text-blue-400 mb-2">
                Transaction History Summary
            </h1>
            <p class="text-lg text-gray-600 dark:text-gray-300">
                Paste or upload your transaction data to get a breakdown by symbol.
            </p>
        </header>

        <!-- Main content will be rendered here by JavaScript -->
        <div id="root"></div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        const root = document.getElementById('root');

        const state = {
            gridData: Array.from({ length: 20 }, () => Array(7).fill('')),
            summary: null,
            errorMessage: '',
            isProcessing: false,
            isGridVisible: true,
            isDownloading: false
        };

        const fixedColumnNames = [
            'Transaction ID',
            'FUID',
            'asset type',
            'value type',
            'amount',
            'date',
            'symbol'
        ];

        const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8', '#82ca9d', '#ffc658'];
        const NON_SYMBOL_TYPES = ['TRANSFER', 'STRATEGY_UMFUTURES_TRANSFER', 'BFUSD_REWARD', 'COIN_SWAP_DEPOSIT', 'COIN_SWAP_WITHDRAW'];

        // Store Chart.js instances to destroy and re-create on re-render
        let charts = {};

        function render() {
            // Main App Structure
            root.innerHTML = `
                <!-- Input section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 mb-8">
                    <div class="p-0">
                        <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4 mb-4">
                            <button id="analyze-btn" class="w-full sm:w-auto px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg shadow-md transition-transform transform hover:scale-105 ${state.isProcessing ? 'opacity-50 cursor-not-allowed' : ''}">
                                ${state.isProcessing ? 'Analyzing...' : 'Analyze Data'}
                            </button>
                            <button id="clear-btn" class="w-full sm:w-auto px-6 py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg shadow-md transition-transform transform hover:scale-105">
                                Clear Values
                            </button>
                            <button id="toggle-grid-btn" class="w-full sm:w-auto px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-lg shadow-md transition-transform transform hover:scale-105">
                                ${state.isGridVisible ? 'Hide Table' : 'Show Table'}
                            </button>
                            <span class="text-gray-500 dark:text-gray-400">or</span>
                            <input type="file" id="file-input" class="hidden" accept=".csv, .xlsx" />
                            <button id="upload-btn" class="w-full sm:w-auto px-6 py-3 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-lg shadow-md transition-transform transform hover:scale-105">
                                Upload File
                            </button>
                            ${state.summary ? `
                            <button id="download-pdf-btn" class="w-full sm:w-auto px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg shadow-md transition-transform transform hover:scale-105 ${state.isDownloading ? 'opacity-50 cursor-not-allowed' : ''}">
                                ${state.isDownloading ? 'Downloading...' : '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-block mr-2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M12 12v6"/><path d="M9 15h6"/></svg> Download PDF'}
                            </button>
                            ` : ''}
                        </div>
                        
                        <!-- Spreadsheet Grid -->
                        <div id="grid-container" class="overflow-x-auto border border-gray-300 dark:border-gray-600 rounded-lg transition-all duration-500 ease-in-out ${state.isGridVisible ? 'max-h-[500px] opacity-100' : 'max-h-0 opacity-25 overflow-hidden'}">
                            <table class="w-full table-fixed border-collapse">
                                <thead>
                                    <tr>
                                        <th class="sticky top-0 left-0 bg-gray-200 dark:bg-gray-700 w-12 text-center text-sm font-semibold p-2 border border-gray-300 dark:border-gray-600"></th>
                                        ${fixedColumnNames.map(name => `<th class="sticky top-0 bg-gray-200 dark:bg-gray-700 text-center text-sm font-semibold p-2 border border-gray-300 dark:border-gray-600 w-32">${name}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.gridData.map((row, rowIndex) => `
                                        <tr>
                                            <td class="sticky left-0 bg-gray-200 dark:bg-gray-700 w-12 text-center text-sm font-semibold p-2 border border-gray-300 dark:border-gray-600">${rowIndex + 1}</td>
                                            ${row.map((cell, colIndex) => `
                                                <td class="p-0 border border-gray-300 dark:border-gray-600">
                                                    <input type="text" value="${cell}" data-row="${rowIndex}" data-col="${colIndex}" class="w-full h-8 px-2 text-sm text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500 grid-cell-input" />
                                                </td>
                                            `).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Error message display -->
                ${state.errorMessage ? `
                <div class="bg-red-500 text-white p-4 rounded-lg shadow-md mb-8">
                    <div class="flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        <p class="font-medium">${state.errorMessage}</p>
                    </div>
                </div>
                ` : ''}

                <!-- Results section -->
                ${state.summary ? `
                <div id="summary-container" class="space-y-8">
                    <div class="flex flex-col items-center p-4 bg-gray-100 dark:bg-gray-700 rounded-md">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-1.78.22c-2.82 2.22-3.8 4.91-3.18 7.37A4.7 4.7 0 0 1 3 12z"/><path d="M12 3a9 9 0 0 1 7.6 4.6l.7.8-1.5 1.5A10.6 10.6 0 0 0 12 3z"/><path d="M12 12h.01"/></svg>
                        <div class="text-xl font-bold mt-2">${state.summary.totalTransactions}</div>
                        <div class="text-sm text-gray-500 dark:text-gray-400">Total Transactions Analyzed</div>
                    </div>
                    
                    <!-- Individual Symbol Tables and Charts -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
                    ${Object.entries(state.summary.symbolSummary).filter(([symbol,]) => symbol !== 'Non-Symbol Transactions').sort(([symA,], [symB,]) => symA.localeCompare(symB)).map(([symbol, data]) => `
                        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg">
                            <div class="p-6">
                                <h3 class="text-lg font-semibold">${symbol} Detailed Breakdown</h3>
                            </div>
                            <div class="p-6 pt-0">
                                <!-- Symbol-specific table -->
                                <div class="border border-gray-300 dark:border-gray-600 rounded-lg w-full overflow-hidden mb-4">
                                    <table class="w-full table-auto text-sm">
                                        <thead>
                                            <tr class="bg-gray-100 dark:bg-gray-700">
                                                <th class="p-2 text-left font-medium">Value Type</th>
                                                <th class="p-2 text-right font-medium">Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${Object.entries(data.breakdown).map(([type, amount]) => `
                                                <tr class="border-b border-gray-200 dark:border-gray-600 last:border-b-0">
                                                    <td class="p-2">${type}</td>
                                                    <td class="p-2 text-right ${amount >= 0 ? 'text-green-500' : 'text-red-500'}">${amount.toFixed(8)}</td>
                                                </tr>
                                            `).join('')}
                                            <tr class="bg-gray-100 dark:bg-gray-700 font-bold">
                                                <td class="p-2">Total</td>
                                                <td class="p-2 text-right ${data.total >= 0 ? 'text-green-500' : 'text-red-500'}">
                                                    ${data.total.toFixed(8)}
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <!-- Trading Volume -->
                                <div class="p-4 bg-gray-100 dark:bg-gray-700 rounded-md w-full mb-4">
                                    <div class="text-sm text-gray-500 dark:text-gray-400">Approximate trading volume</div>
                                    <div class="text-xl font-bold mt-1 text-gray-900 dark:text-gray-100">
                                        ${data.tradingVolume !== null ? `$${data.tradingVolume.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : 'N/A'}
                                    </div>
                                </div>
                                <!-- Percentage Breakdown -->
                                <div class="mt-4">
                                    <h4 class="text-md font-semibold text-gray-700 dark:text-gray-300">Breakdown by Percentage</h4>
                                    <ul class="space-y-1 mt-2">
                                        ${data.chartData.map((item, index) => `
                                            <li class="flex items-center justify-between text-sm p-2 rounded-md bg-gray-100 dark:bg-gray-700">
                                                <div class="flex items-center space-x-2">
                                                    <div class="w-3 h-3 rounded-full" style="background-color: ${COLORS[index % COLORS.length]};"></div>
                                                    <span>${item.name}</span>
                                                </div>
                                                <span class="font-medium text-blue-500">${(item.percentage).toFixed(2)}%</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                                <!-- Pie Chart -->
                                <div class="w-full mt-4">
                                    <canvas id="chart-canvas-${symbol}"></canvas>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                    </div>

                    <!-- Non-Symbol Transactions Table -->
                    ${state.summary.symbolSummary['Non-Symbol Transactions'] ? `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg">
                        <div class="p-6">
                            <h3 class="text-lg font-semibold">Non-Symbol Transactions</h3>
                        </div>
                        <div class="p-6 pt-0">
                            <div class="border border-gray-300 dark:border-gray-600 rounded-lg w-full overflow-hidden">
                                <table class="w-full table-auto text-sm">
                                    <thead>
                                        <tr class="bg-gray-100 dark:bg-gray-700">
                                            <th class="p-2 text-left font-medium">Value Type</th>
                                            <th class="p-2 text-right font-medium">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${Object.entries(state.summary.symbolSummary['Non-Symbol Transactions'].breakdown).map(([type, amount]) => `
                                            <tr class="border-b border-gray-200 dark:border-gray-600 last:border-b-0">
                                                <td class="p-2">${type}</td>
                                                <td class="p-2 text-right ${amount >= 0 ? 'text-green-500' : 'text-red-500'}">${amount.toFixed(8)}</td>
                                            </tr>
                                        `).join('')}
                                        <tr class="bg-gray-100 dark:bg-gray-700 font-bold">
                                            <td class="p-2">Total</td>
                                            <td class="p-2 text-right ${state.summary.symbolSummary['Non-Symbol Transactions'].total >= 0 ? 'text-green-500' : 'text-red-500'}">
                                                ${state.summary.symbolSummary['Non-Symbol Transactions'].total.toFixed(8)}
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    ` : ''}
                </div>
                ` : ''}
            `;

            attachEvents();
            if (state.summary) {
                renderCharts();
            }
        }

        function attachEvents() {
            document.getElementById('analyze-btn').onclick = handleAnalyzeGrid;
            document.getElementById('clear-btn').onclick = handleClearGrid;
            document.getElementById('toggle-grid-btn').onclick = handleToggleGrid;
            document.getElementById('upload-btn').onclick = () => document.getElementById('file-input').click();
            document.getElementById('file-input').onchange = handleFileChange;
            
            if (state.summary) {
                document.getElementById('download-pdf-btn').onclick = handleDownloadPdf;
            }

            document.querySelectorAll('.grid-cell-input').forEach(input => {
                input.oninput = (e) => {
                    const row = parseInt(e.target.dataset.row);
                    const col = parseInt(e.target.dataset.col);
                    state.gridData[row][col] = e.target.value;
                };
                input.onpaste = handlePaste;
            });
        }

        function parseData(rawData) {
            const lines = rawData.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            const isTabSeparated = lines[0].includes('\t');
            const delimiter = isTabSeparated ? '\t' : ',';
            
            return lines.map(line => {
                const cells = [];
                let inQuote = false;
                let cell = '';
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === delimiter && !inQuote) {
                        cells.push(cell.trim());
                        cell = '';
                    } else {
                        cell += char;
                    }
                }
                cells.push(cell.trim());
                return cells;
            });
        }

        function processData(rawData) {
            state.isProcessing = true;
            state.errorMessage = '';
            state.summary = null;
            render();

            try {
                const parsedRows = parseData(rawData);
                if (parsedRows.length < 2) {
                    state.errorMessage = 'File must contain a header and at least one row of data.';
                    state.isProcessing = false;
                    render();
                    return;
                }
                
                const headerRow = parsedRows[0];
                const dataRows = parsedRows.slice(1);

                // Find the indices of the required columns dynamically
                const typeIndex = headerRow.findIndex(h => h.trim().toLowerCase() === 'type');
                const amountIndex = headerRow.findIndex(h => h.trim().toLowerCase() === 'amount');
                const symbolIndex = headerRow.findIndex(h => h.trim().toLowerCase() === 'symbol');
                
                if (typeIndex === -1 || amountIndex === -1 || symbolIndex === -1) {
                    state.errorMessage = `Could not find all required columns (Type, Amount, Symbol). Please check your file's headers.`;
                    state.isProcessing = false;
                    render();
                    return;
                }

                // Value type mapping based on user request
                const valueTypeMapping = {
                    'COMMISSION': 'Trading fees',
                    'FUNDING_FEE': 'Funding fees',
                    'REALIZED_PNL': 'Profit and losses',
                };

                const symbolSummary = {};
                let totalTransactions = 0;

                dataRows.forEach(row => {
                    // Check if the row has enough columns to avoid errors
                    if (row.length > Math.max(typeIndex, amountIndex, symbolIndex)) {
                        const originalValueType = row[typeIndex]?.toUpperCase();
                        const amount = parseFloat(row[amountIndex]);
                        let symbol = row[symbolIndex];

                        if (NON_SYMBOL_TYPES.includes(originalValueType)) {
                            symbol = 'Non-Symbol Transactions';
                        }
                        
                        // Apply the mapping, or use the original type if no mapping exists
                        const mappedValueType = valueTypeMapping[originalValueType] || originalValueType;

                        // Only process valid transactions
                        if (mappedValueType && !isNaN(amount) && symbol && symbol.trim() !== '') {
                            totalTransactions++;
                            if (!symbolSummary[symbol]) {
                                symbolSummary[symbol] = { total: 0, breakdown: {}, chartData: [], tradingVolume: null };
                            }
                            if (!symbolSummary[symbol].breakdown[mappedValueType]) {
                                symbolSummary[symbol].breakdown[mappedValueType] = 0;
                            }
                            symbolSummary[symbol].breakdown[mappedValueType] += amount;
                            symbolSummary[symbol].total += amount;
                        }
                    }
                });
                
                if (totalTransactions === 0) {
                    state.errorMessage = 'No valid transactions with a symbol, value type, and amount could be found in the data.';
                    state.isProcessing = false;
                    render();
                    return;
                }

                Object.keys(symbolSummary).forEach(symbol => {
                    const breakdownData = symbolSummary[symbol].breakdown;
                    
                    const totalAbsoluteValue = Object.values(breakdownData).reduce((sum, value) => sum + Math.abs(value), 0);

                    // Add percentage to the chartData for rendering the list
                    symbolSummary[symbol].chartData = Object.entries(breakdownData).map(([name, value]) => ({
                        name,
                        value: Math.abs(value),
                        percentage: totalAbsoluteValue > 0 ? (Math.abs(value) / totalAbsoluteValue) * 100 : 0
                    }));

                    // Calculate trading volume only for actual trading symbols
                    if (symbol !== 'Non-Symbol Transactions') {
                        const tradingFees = breakdownData['Trading fees'];
                        if (tradingFees !== undefined && tradingFees !== 0) {
                            symbolSummary[symbol].tradingVolume = Math.abs(tradingFees) / 0.0005; 
                        }
                    }
                });

                state.summary = { symbolSummary, totalTransactions };
                state.isProcessing = false;
                state.isGridVisible = false;
                render();
            } catch (error) {
                console.error('Data processing error:', error);
                state.errorMessage = `An error occurred while processing the data: ${error.message}`;
                state.isProcessing = false;
                render();
            }
        }

        function handlePaste(e) {
            e.preventDefault();
            const pastedText = (e.clipboardData || window.clipboardData).getData('text');
            const parsedData = parseData(pastedText);

            let rowStart = 0;
            let colStart = 0;
            if (document.activeElement && document.activeElement.classList.contains('grid-cell-input')) {
                rowStart = parseInt(document.activeElement.dataset.row, 10);
                colStart = parseInt(document.activeElement.dataset.col, 10);
            }
            
            const newGridData = state.gridData.map(row => [...row]);
            
            parsedData.forEach((pastedRow, rIdx) => {
                pastedRow.forEach((pastedCell, cIdx) => {
                    const gridRowIndex = rowStart + rIdx;
                    const gridColIndex = colStart + cIdx;
                    if (gridRowIndex < newGridData.length && gridColIndex < newGridData[gridRowIndex].length) {
                        newGridData[gridRowIndex][gridColIndex] = pastedCell;
                    }
                });
            });

            state.gridData = newGridData;
            render();
        }
        
        function handleFileChange(e) {
            const file = e.target.files[0];
            if (!file) {
                return;
            }

            state.isProcessing = true;
            state.errorMessage = '';
            state.summary = null;
            render();
            
            const fileExtension = file.name.split('.').pop().toLowerCase();

            const reader = new FileReader();

            reader.onload = (event) => {
                let fileData = event.target.result;
                let dataString = '';

                if (fileExtension === 'csv') {
                    // For CSV files, read as text and process directly
                    dataString = fileData;
                    processData(dataString);
                } else if (fileExtension === 'xlsx') {
                    // For XLSX files, process with the XLSX library
                    try {
                        const workbook = XLSX.read(fileData, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        dataString = XLSX.utils.sheet_to_csv(worksheet);
                        processData(dataString);
                    } catch (error) {
                        console.error('Excel processing error:', error);
                        state.errorMessage = `Failed to process Excel file: ${error.message}. Please ensure it is a valid .xlsx file.`;
                        state.isProcessing = false;
                        render();
                    }
                } else {
                    state.errorMessage = 'Unsupported file type. Please upload a .csv or .xlsx file.';
                    state.isProcessing = false;
                    render();
                }
            };

            reader.onerror = () => {
                state.errorMessage = 'Error reading file. Please try again.';
                state.isProcessing = false;
                render();
            };

            if (fileExtension === 'csv') {
                reader.readAsText(file);
            } else if (fileExtension === 'xlsx') {
                reader.readAsBinaryString(file);
            }
        }

        function getGridDataAsString() {
            const dataRows = state.gridData
                .filter(row => row.some(cell => cell.trim() !== ''))
                .map(row => row.map(cell => `"${cell.replace(/"/g, '""')}"`).join(','));
            return dataRows.join('\n');
        }

        function handleAnalyzeGrid() {
            const dataString = getGridDataAsString();
            if (dataString.trim() !== '') {
                processData(dataString);
            } else {
                state.errorMessage = 'Please enter or paste data into the grid before analyzing.';
                render();
            }
        }
        
        function handleClearGrid() {
            state.gridData = Array.from({ length: 20 }, () => Array(7).fill(''));
            state.summary = null;
            state.errorMessage = '';
            state.isGridVisible = true;
            render();
        }

        function handleToggleGrid() {
            state.isGridVisible = !state.isGridVisible;
            render();
        }

        async function handleDownloadPdf() {
            state.isDownloading = true;
            render();
            
            const element = document.getElementById('summary-container');
            if (!element) {
                state.isDownloading = false;
                state.errorMessage = 'Could not find summary element to download.';
                render();
                return;
            }

            try {
                const canvas = await html2canvas(element, { scale: 2, logging: false });
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgWidth = 210;
                const pageHeight = 297;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                let heightLeft = imgHeight;
                let position = 0;

                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                
                pdf.save('TransactionSummary.pdf');
            } catch (error) {
                console.error('PDF generation error:', error);
                state.errorMessage = `Failed to generate PDF: ${error.message}`;
            } finally {
                state.isDownloading = false;
                render();
            }
        }
        
        // Function to destroy old charts and render new ones using Chart.js
        function renderCharts() {
            if (!state.summary) return;

            // Destroy any existing chart instances to prevent memory leaks
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};

            const { symbolSummary } = state.summary;
            
            Object.entries(symbolSummary).filter(([symbol,]) => symbol !== 'Non-Symbol Transactions').forEach(([symbol, data]) => {
                const canvasElement = document.getElementById(`chart-canvas-${symbol}`);
                if (canvasElement) {
                    const chartData = {
                        labels: data.chartData.map(d => d.name),
                        datasets: [{
                            data: data.chartData.map(d => d.value),
                            backgroundColor: COLORS.slice(0, data.chartData.length),
                            hoverOffset: 4
                        }]
                    };

                    const config = {
                        type: 'pie',
                        data: chartData,
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        font: {
                                            family: 'Inter'
                                        }
                                    }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const total = context.dataset.data.reduce((sum, value) => sum + value, 0);
                                            const value = context.parsed;
                                            const percentage = total > 0 ? (value / total * 100).toFixed(2) : 0;
                                            return `${context.label}: ${value.toFixed(8)} (${percentage}%)`;
                                        },
                                        footer: function(tooltipItems) {
                                            let sum = 0;
                                            tooltipItems.forEach(function(tooltipItem) {
                                                sum += tooltipItem.parsed;
                                            });
                                            return `Total: ${sum.toFixed(8)}`;
                                        }
                                    },
                                    bodyFont: {
                                        family: 'Inter'
                                    }
                                }
                            }
                        }
                    };

                    // Create a new Chart.js instance and store it
                    charts[symbol] = new Chart(canvasElement, config);
                }
            });
        }

        // Initial render on page load
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
